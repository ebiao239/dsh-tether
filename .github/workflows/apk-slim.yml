name: lan-slim
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk-slim:
    name: android apk slim arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
        with: { packages: platform-tools }
      - name: 装 NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - run: pnpm install
        working-directory: app
      - run: rm -rf app/src-tauri/android-runtime
      - name: 生成 android 工程(并剥离调试符号配置)
        run: |
          pnpm exec tauri android init --ci
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("app/src-tauri/gen/android/app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")
          # 删除 debug 变体里强制保留 .so 调试符号的 4 行(这是 APK 344MB .so 的元凶)
          s = re.sub(r'\s*jniLibs\.keepDebugSymbols\.add\("[^"]+"\)\n?', '\n', s)
          # release 签名缺失时,复用 debug keystore 签名,保证 release 包也能 sideload
          s = s.replace(
            'if (keystoreProperties.containsKey("storeFile")) {\n                signingConfig = signingConfigs.getByName("release")\n            }',
            'signingConfig = signingConfigs.getByName("debug")'
          )
          p.write_text(s, encoding="utf-8")
          print("patched build.gradle.kts")
          PY
      - run: pnpm exec tauri android build --apk --release --split-per-abi --target aarch64
        working-directory: app
      - name: APK 改名
        run: |
          version=$(node -p "require('./package.json').version")
          find app/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | while read -r f; do
            mv "$f" "$(dirname "$f")/dsh-tether-$version-arm64-slim.apk"
          done
          ls -la app/src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
      - uses: actions/upload-artifact@v7
        with:
          name: apk-slim
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error
