name: lan-slim
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apk-slim.yml"
      - "app/**"
      - "package.json"
permissions:
  contents: read
jobs:
  apk-slim:
    name: android apk slim arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
        with: { packages: platform-tools }
      - name: 装 NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app/src-tauri -> target }
      - run: pnpm install
        working-directory: app
      - run: rm -rf app/src-tauri/android-runtime
      - name: 同步 tauri.conf.json 版本
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          version = subprocess.check_output(["node", "-p", "require('./package.json').version"], text=True).strip()
          p = pathlib.Path('app/src-tauri/tauri.conf.json')
          c = json.loads(p.read_text())
          c['version'] = version
          p.write_text(json.dumps(c, indent=2) + '\n')
          print(f"tauri.conf.json version -> {version}")
          PY
      - name: 生成 android 工程
        working-directory: app
        run: pnpm exec tauri android init --ci
      - name: 注入固定 debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          echo "keystore written ($(wc -c < ~/.android/debug.keystore) bytes)"
      - name: 让 release 变体用固定 debug 签名
        working-directory: app
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("src-tauri/gen/android/app/build.gradle.kts")
          s = p.read_text()

          # 1) signingConfigs.release 指向固定 debug keystore
          old_sc = 'keystoreProperties["storeFile"]?.let { storeFile = file(it as String) }'
          if old_sc in s:
              s = s.replace(
                  'keystoreProperties["storeFile"]?.let { storeFile = file(it as String) }',
                  'storeFile = file(System.getProperty("user.home") + "/.android/debug.keystore")'
              )
              s = s.replace(
                  'storePassword = keystoreProperties["storePassword"] as String?',
                  'storePassword = "android"'
              )
              s = s.replace(
                  'keyAlias = keystoreProperties["keyAlias"] as String?',
                  'keyAlias = "androiddebugkey"'
              )
              s = s.replace(
                  'keyPassword = keystoreProperties["password"] as String?',
                  'keyPassword = "android"'
              )
              print("patched signingConfigs.release -> fixed debug keystore")
          else:
              print("WARN: signingConfigs.release old pattern not found")

          # 2) buildTypes.release 无条件引用 release signingConfig（否则产 unsigned APK）
          old_bt = 'if (keystoreProperties.containsKey("storeFile")) {\n                signingConfig = signingConfigs.getByName("release")\n            }'
          if old_bt in s:
              s = s.replace(old_bt, 'signingConfig = signingConfigs.getByName("release")')
              print("patched buildTypes.release -> unconditional signing")
          else:
              print("WARN: buildTypes.release if-block not found")

          p.write_text(s)
          print("done")
          PY
      - name: 构建 APK
        working-directory: app
        run: pnpm exec tauri android build --apk --split-per-abi --target aarch64
      - name: APK 改名
        run: |
          version=$(node -p "require('./package.json').version")
          find app/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | while read -r f; do
            mv "$f" "$(dirname "$f")/dsh-tether-$version-arm64-slim.apk"
          done
          ls -la app/src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
      - uses: actions/upload-artifact@v7
        with:
          name: apk-slim
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error