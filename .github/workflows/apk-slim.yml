name: lan-slim
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apk-slim.yml"
      - "app/**"
      - "package.json"
permissions:
  contents: read
jobs:
  apk-slim:
    name: android apk slim arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
        with: { packages: platform-tools }
      - name: 装 NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app/src-tauri -> target }
      - run: pnpm install
        working-directory: app
      - run: rm -rf app/src-tauri/android-runtime
      - name: 同步 tauri.conf.json 版本
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          version = subprocess.check_output(["node", "-p", "require('./package.json').version"], text=True).strip()
          p = pathlib.Path('app/src-tauri/tauri.conf.json')
          c = json.loads(p.read_text())
          c['version'] = version
          p.write_text(json.dumps(c, indent=2) + '\n')
          print(f"tauri.conf.json version -> {version}")
          PY
      - name: 生成 android 工程
        working-directory: app
        run: pnpm exec tauri android init --ci
      - name: 注入固定 debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          echo "keystore written ($(wc -c < ~/.android/debug.keystore) bytes)"
            - name: 让 release 变体用固定 debug 签名
        working-directory: app
        run: |
          echo "===== build.gradle.kts 签名相关（patch 前）====="
          grep -n "signingConfig\|keystore\|buildTypes\|getByName\|storeFile\|storePassword\|keyAlias\|keyPassword" src-tauri/gen/android/app/build.gradle.kts || true
          echo "===== 完整 build.gradle.kts ====="
          cat src-tauri/gen/android/app/build.gradle.kts
          echo "===== 开始 patch ====="
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("src-tauri/gen/android/app/build.gradle.kts")
          s = p.read_text()

          # 用更鲁棒的方式：正则替换 release signingConfigs 块里的 keystoreProperties 引用
          import re
          # 1) 把 storeFile 那行替换成固定 debug keystore
          s2 = s.replace('keystoreProperties["storeFile"]?.let { storeFile = file(it as String) }',
                         'storeFile = file(System.getProperty("user.home") + "/.android/debug.keystore")')
          s2 = s2.replace('storePassword = keystoreProperties["storePassword"] as String?', 'storePassword = "android"')
          s2 = s2.replace('keyAlias = keystoreProperties["keyAlias"] as String?', 'keyAlias = "androiddebugkey"')
          s2 = s2.replace('keyPassword = keystoreProperties["password"] as String?', 'keyPassword = "android"')

          # 2) buildTypes.release 无条件引用 signingConfig
          # 匹配 if (keystoreProperties.containsKey(...)) { ... signingConfig ... } 块
          s2 = re.sub(
              r'if \(keystoreProperties\.containsKey\("storeFile"\)\) \{\s*signingConfig = signingConfigs\.getByName\("release"\)\s*\}',
              'signingConfig = signingConfigs.getByName("release")',
              s2
          )
          p.write_text(s2)
          print("PATCH_DONE")
          PY
          echo "===== build.gradle.kts 签名相关（patch 后）====="
          grep -n "signingConfig\|keystore\|storeFile\|storePassword\|keyAlias\|keyPassword" src-tauri/gen/android/app/build.gradle.kts || true
- name: 构建 APK
        working-directory: app
        run: pnpm exec tauri android build --apk --split-per-abi --target aarch64
      - name: APK 改名
        run: |
          version=$(node -p "require('./package.json').version")
          find app/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | while read -r f; do
            mv "$f" "$(dirname "$f")/dsh-tether-$version-arm64-slim.apk"
          done
          ls -la app/src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
      - uses: actions/upload-artifact@v7
        with:
          name: apk-slim
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error