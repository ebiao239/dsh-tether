name: lan-slim
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apk-slim.yml"
      - "app/**"
      - "package.json"
permissions:
  contents: read
jobs:
  apk-slim:
    name: android apk slim arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
        with: { packages: platform-tools }
      - name: 装 NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app/src-tauri -> target }
      - run: pnpm install
        working-directory: app
      - run: rm -rf app/src-tauri/android-runtime
      - name: 同步 tauri.conf.json 版本
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          version = subprocess.check_output(["node", "-p", "require('./package.json').version"], text=True).strip()
          p = pathlib.Path('app/src-tauri/tauri.conf.json')
          c = json.loads(p.read_text())
          c['version'] = version
          p.write_text(json.dumps(c, indent=2) + '\n')
          print(f"tauri.conf.json version -> {version}")
          PY
      - name: 生成 android 工程
        working-directory: app
        run: pnpm exec tauri android init --ci
      - name: 注入固定 debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          echo "keystore written ($(wc -c < ~/.android/debug.keystore) bytes)"
          echo "===== 注入的 keystore 证书指纹 ====="
          keytool -printcert -jarfile /dev/null 2>/dev/null || true
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey 2>&1 | grep -A2 "SHA256\|证书指纹\|Certificate fingerprint" || true
          echo "===== 指纹打印结束 ====="
      - name: 打印并修复签名配置
        working-directory: app
        run: |
          echo "===== patch 前 build.gradle.kts 签名行 ====="
          grep -n "signingConfig\|keystore\|buildTypes\|getByName\|storeFile\|storePassword\|keyAlias\|keyPassword\|create(" src-tauri/gen/android/app/build.gradle.kts || true
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("src-tauri/gen/android/app/build.gradle.kts")
          s = p.read_text()

          # 1) signingConfigs.release 指向固定 debug keystore
          s = s.replace('keystoreProperties["storeFile"]?.let { storeFile = file(it as String) }',
                        'storeFile = file(System.getProperty("user.home") + "/.android/debug.keystore")')
          s = s.replace('storePassword = keystoreProperties["storePassword"] as String?', 'storePassword = "android"')
          s = s.replace('keyAlias = keystoreProperties["keyAlias"] as String?', 'keyAlias = "androiddebugkey"')
          s = s.replace('keyPassword = keystoreProperties["password"] as String?', 'keyPassword = "android"')

          # 2) buildTypes.release 无条件引用 signingConfig
          s = re.sub(
              r'if \(keystoreProperties\.containsKey\("storeFile"\)\) \{\s*signingConfig = signingConfigs\.getByName\("release"\)\s*\}',
              'signingConfig = signingConfigs.getByName("release")',
              s
          )
          p.write_text(s)
          print("PATCH_DONE")
          PY
          echo "===== patch 后 build.gradle.kts 签名行 ====="
          grep -n "signingConfig\|keystore\|storeFile\|storePassword\|keyAlias\|keyPassword" src-tauri/gen/android/app/build.gradle.kts || true
      - name: 构建 APK
        working-directory: app
        run: pnpm exec tauri android build --apk --split-per-abi --target aarch64
      - name: APK 改名
        run: |
          version=$(node -p "require('./package.json').version")
          find app/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | while read -r f; do
            mv "$f" "$(dirname "$f")/dsh-tether-$version-arm64-slim.apk"
          done
          ls -la app/src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
          echo "===== APK 签名验证（apksigner）====="
          APK_FILE=$(find app/src-tauri/gen/android/app/build/outputs/apk -name 'dsh-tether-*.apk' | head -1)
          echo "APK_FILE=$APK_FILE"
          $ANDROID_HOME/build-tools/*/apksigner verify --print-certs "$APK_FILE" 2>&1 | head -40 || true
          echo "===== 验证结束 ====="
      - uses: actions/upload-artifact@v7
        with:
          name: apk-slim
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error